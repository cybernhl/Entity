        kotlin_version = libs.versions.kotlin.asProvider().get()
        println "Type of libs.versions.kotlin: " + libs.versions.kotlin.class
        println ">>> TYPE TEST >>> libs.versions.kotlin class: " + libs.versions.kotlin.class.name
        println "Show  kotlin_version  : ${kotlin_version}"

        navigation_version = libs.versions.androidx.navigation.get()

        coroutine_version = "1.6.4"
        jb_compose_version = libs.versions.jetbrains.compose.multiplatform.get()
        println "Type of libs.versions.jetbrains.compose.multiplatform: " + libs.versions.jetbrains.compose.multiplatform.class
        println ">>> TYPE TEST >>> libs.versions.jetbrains.compose.multiplatform class: " + libs.versions.jetbrains.compose.multiplatform.class.name

        navigation_version = libs.versions.androidx.navigation.get()
    }

    println "Show  fianl kotlin_version  : ${kotlin_version}"

    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url = uri('https://maven.pkg.jetbrains.space/public/p/compose/dev')
        }
    }
    dependencies {
//        classpath "com.android.tools.build:gradle:$agp_gradle"
